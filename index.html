
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080b12">
  <meta name="description" content="TH3JUR4N Search: buscador personal y acceso a mi portafolio.">

  <title>TH3JUR4N Search</title>

  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>

<body class="home-page">
  <main class="home-main">
    <section class="home-content" aria-labelledby="brand-title">

      <h1 id="brand-title" class="brand-title">
        TH3JUR4N<span>.</span>
      </h1>

      <p class="brand-subtitle">Search</p>

      <form
        id="search-form"
        class="search-form"
        action="results.html"
        method="GET"
        role="search"
      >
        <label class="sr-only" for="search-input">
          Escribe tu búsqueda
        </label>

        <span class="search-icon" aria-hidden="true">⌕</span>

        <input
          id="search-input"
          name="q"
          type="search"
          placeholder="Buscar..."
          autocomplete="off"
          spellcheck="false"
          required
        >

        <button
          class="submit-search"
          type="submit"
          aria-label="Buscar"
        >
          <span aria-hidden="true">↵</span>
        </button>
      </form>

    </section>
  </main>
</body>
</html>
